# Construeix el web (eines/build.py) i el publica a GitHub Pages.
# - A cada push a main: comprova, construeix i publica (tot el web; triga uns 3 minuts).
# - A cada pull request: comprova i construeix, sense publicar.
# - Els canvis que només toquen documentació (*.md) no construeixen res.
# - Es pot llançar a mà des de la pestanya Actions (workflow_dispatch).
name: Web

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construeix:
    name: Comprova i construeix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial complet: les dates del sitemap surten de git

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eines/requirements.txt

      - name: Dependències de Python
        run: pip install -r eines/requirements.txt

      - name: Memòria cau del navegador (PDF dels temes)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('eines/requirements.txt') }}

      - name: Navegador per als PDF
        run: python -m playwright install --with-deps chromium

      - name: Memòria cau dels PDF oficials
        uses: actions/cache@v4
        with:
          path: fonts/pdf
          key: fonts-oficials-${{ hashFiles('dades/fonts_oficials.json') }}

      - name: PDF oficials (release «fonts-oficials»)
        run: python eines/fonts_oficials.py baixa

      - name: Construcció del web
        run: python eines/build.py

      - name: Paquet per a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publica:
    name: Publica a GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: construeix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacio.outputs.page_url }}
    steps:
      - id: publicacio
        uses: actions/deploy-pages@v4
